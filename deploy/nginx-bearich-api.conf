# Nginx site config untuk backend Bearich Outreach API
# Simpan di: /etc/nginx/sites-available/bearich-api
# Aktifkan: sudo ln -s /etc/nginx/sites-available/bearich-api /etc/nginx/sites-enabled/
# Lalu jalankan certbot: sudo certbot --nginx -d bearich-outreach.duckdns.org

server {
    listen 80;
    server_name bearich-outreach.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}