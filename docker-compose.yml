services:
  bearich-api:
    build: .
    image: bearich-api:latest
    container_name: bearich-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      DB_HOST: global-mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-bearich}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-bearich}
      PORT: "4000"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://bearich-outreach.vercel.app}
      NODE_ENV: production
      COOKIE_SAMESITE: none
      WA_GATEWAY_URL: ${WA_GATEWAY_URL:-http://evolution:8080}
      WA_GATEWAY_KEY: ${WA_GATEWAY_KEY:-}
      WA_INSTANCE: ${WA_INSTANCE:-bearich-wa1}
      WA_WEBHOOK_SECRET: ${WA_WEBHOOK_SECRET:-}
      AUTOPILOT_DRY_RUN: ${AUTOPILOT_DRY_RUN:-true}
      DAILY_DEEPSEEK_LIMIT: ${DAILY_DEEPSEEK_LIMIT:-15}
      PROXY_URL: ${PROXY_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    networks:
      - global-network
    shm_size: 1gb

  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: bearich-evolution
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_PROVIDER: sqlite
      DATABASE_CONNECTION_URI: "file:/evolution/instances/evolution.db"
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: "false"
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${WA_GATEWAY_KEY:-changeme}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      QRCODE_LIMIT: "30"
      WEBHOOK_GLOBAL_URL: http://bearich-api:4000/api/webhooks/wa
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "true"
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - global-network

volumes:
  evolution_data:

networks:
  global-network:
    external: true